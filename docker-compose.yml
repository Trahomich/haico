services:
  haico:
    build:
      context: .
      # docker compose build --pull to refresh the base image
    image: ghcr.io/trahomich/haico:latest
    container_name: haico
    restart: unless-stopped
    ports:
      - "4567:4567"
    env_file:
      # Optional file with model API keys for bundled agent CLIs:
      # ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, ...
      - path: .env
        required: false
    environment:
      HAICO_HOST: "0.0.0.0"
      HAICO_PORT: "4567"
      HAICO_DB_PATH: /data/haico.db
      # --- first-boot admin (remove after initial setup) ---
      # HAICO_DEFAULT_ADMIN: "true"
      # HAICO_DEFAULT_ADMIN_PASSWORD: "change-me"
      # --- orchestration ---
      # HAICO_ORCHESTRATOR_ENGINE: "langgraph"   # langgraph | native
      # HAICO_EVENT_LOG: "on"
    volumes:
      # SQLite DB + fallback agent workspaces (container cwd)
      - haico-data:/data
      # Agent CLI configs & logins (~/.claude, ~/.codex, ~/.gemini, ~/.pi, ~/.config/omp)
      - haico-agent-home:/home/haico
      # Project workspaces for agents live on the host — mount them here and
      # point agent working_directory at e.g. /workspaces/my-project:
      # - ~/src:/workspaces
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4567/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  haico-data:
  haico-agent-home:
